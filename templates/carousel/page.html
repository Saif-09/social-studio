<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;0,8..60,800;0,8..60,900;1,8..60,500;1,8..60,600;1,8..60,700&family=Amiri:wght@400;700&family=Amiri+Quran&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000}
#f{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink)}
.paper{background:var(--paper);background-image:linear-gradient(rgba(60,40,10,.045) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(60,40,10,.045) 1.5px,transparent 1.5px);background-size:54px 54px}
.paper:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(80,50,10,.10))}
.safe{position:absolute;left:84px;right:84px;top:76px;bottom:72px;display:flex;flex-direction:column;z-index:2}
.top{flex:none;display:flex;justify-content:space-between;align-items:center;font:800 22px/1 Inter;letter-spacing:.2em;text-transform:uppercase}
.top .lab{color:var(--a)} .top .h{color:var(--mut);letter-spacing:.04em;text-transform:none;font-weight:700;font-size:24px}
.serif{font-family:'Source Serif 4',serif}
em{font-style:italic;color:var(--a)}
.num{flex:none;display:flex;align-items:baseline;gap:18px;margin-top:40px}
.num b{font:900 150px/.8 'Source Serif 4',serif;color:var(--a);letter-spacing:-.04em}
.num span{font:700 30px/1 Inter;color:var(--mut)}
h1{flex:none;font:900 118px/.98 'Source Serif 4',serif;letter-spacing:-.035em;margin-top:44px}
h2{flex:none;font:800 78px/1.02 'Source Serif 4',serif;letter-spacing:-.025em;margin-top:30px}
.sub{flex:none;font:600 38px/1.3 Inter;color:var(--body);margin-top:30px;letter-spacing:-.01em}
.art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:34px 0 30px;background:var(--card);border-radius:40px;padding:34px;position:relative;overflow:hidden}
.art:before{content:"";position:absolute;inset:16px;border:2.5px dashed var(--a);opacity:.22;border-radius:28px}
.art svg{height:100%;max-height:var(--artmax,520px);width:auto;max-width:100%;position:relative}
.qcard .qin{display:flex;flex-direction:column;align-items:center;position:relative;width:100%}
.qcard svg{height:130px!important;max-height:130px;margin-bottom:6px}
.qcard .ar.q{line-height:1.85;margin:0;padding:0 10px}
.rsrc{flex:none;align-self:flex-start;margin-top:22px}
.cover .art{background:none;padding:10px;margin:20px 0}.cover .art:before{display:none}
.ar{flex:none;direction:rtl;text-align:center;font:700 58px/1.5 Amiri,serif;color:var(--ink);margin-bottom:6px}
.ar.q{font:400 60px/1.75 'Amiri Quran',serif}
.tr{flex:none;text-align:center;font:italic 600 30px/1.35 'Source Serif 4',serif;color:var(--a);margin-bottom:18px}
.qt{flex:none;font:italic 500 37px/1.36 'Source Serif 4',serif;color:var(--body);border-left:6px solid var(--a);padding:4px 0 4px 28px}
.qt.c{border:0;padding:0;text-align:center;font-size:37px}
.foot{flex:none;display:flex;align-items:center;justify-content:space-between;margin-top:36px;gap:20px}
.src{font:800 24px/1 Inter;letter-spacing:.02em;background:var(--a);color:var(--paper);padding:15px 22px;border-radius:40px;white-space:nowrap}
.dots{display:flex;gap:9px}.dots i{width:11px;height:11px;border-radius:50%;background:var(--ink);opacity:.18}.dots i.on{opacity:1;background:var(--a)}
.swipe{font:800 24px/1 Inter;color:var(--a);letter-spacing:.06em;white-space:nowrap}
.pill{display:inline-block;align-self:flex-start;margin-top:40px;font:800 24px/1 Inter;letter-spacing:.18em;text-transform:uppercase;border:3px solid var(--a);color:var(--a);padding:14px 20px;border-radius:40px}
.cta{font:800 28px/1 Inter;background:var(--ink);color:var(--paper);padding:20px 30px;border-radius:50px;white-space:nowrap}
.list{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:20px;margin-top:20px}
.list div{display:flex;align-items:center;gap:24px;font:700 40px/1.2 'Source Serif 4',serif}
.list div i{flex:none;width:52px;height:52px;border-radius:50%;background:var(--a);color:var(--paper);font:900 26px/52px Inter;font-style:normal;text-align:center}
.ask{flex:none;border:3px dashed var(--a);border-radius:26px;padding:26px 30px;font:700 34px/1.3 Inter;text-align:center;margin-top:28px}
.ask b{color:var(--a)}
/* single posts */
.dark{color:#F6EEDC}
.bg{position:absolute;inset:0}
.dark .safe{justify-content:center}
.dark .top{position:absolute;top:0;left:0;right:0}
.dark .top .lab{color:#E8B45A}.dark .top .h{color:rgba(246,238,220,.6)}
.dark .ar.q{color:#F3E6C2;font-size:62px;margin-bottom:34px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.big{color:#F6EEDC;font:800 70px/1.12 'Source Serif 4',serif;letter-spacing:-.02em;text-align:center;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.big em{color:#E8B45A}
.ref{margin-top:34px;text-align:center;font:800 24px/1 Inter;letter-spacing:.18em;text-transform:uppercase;color:#E8B45A}
.dark .bot{position:absolute;left:0;right:0;bottom:14px;text-align:center;font:700 28px/1.3 Inter;color:rgba(246,238,220,.82)}
.dark .bot b{color:#E8B45A}
.al{font-family:Amiri,serif;font-weight:700;font-style:normal;color:var(--a);unicode-bidi:isolate}
.dark .al{color:#E8B45A}
h1 .s,h2 .s{font-size:.62em;vertical-align:.12em}
.s{font-family:Amiri,serif;font-style:normal;font-weight:400;unicode-bidi:isolate}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,.42),rgba(0,0,0,0) 70%)}
</style></head>
<body><div id="f"></div>
<script src="art.js"></script>
<script src="posts.js"></script>
<script>
const md = (s) => String(s).replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\|/g, "<br>").replace(/\bAllah\b/g, '<span class="al">اللّٰه</span>').replace(/ﷺ/g, '<span class="s">ﷺ</span>');
const svg = (name, P) => { const [vb, body] = ART[name](P); return `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`; };
const [pid, sn] = (location.hash.slice(1) || "C01/1").split("/");
const post = POSTS.find((p) => p.id === pid), i = +sn - 1, sl = post.slides ? post.slides[i] : null;
const F = document.getElementById("f");
const P = Object.assign({ ink: "#1E1A14", p: "#F5EEDF", g: "#E2B94A", d: "#1C2A3A" }, post.pal);
F.style.cssText = `--ink:${P.ink};--paper:${P.p};--a:${P.a};--card:${P.s}88;--mut:#9A8F7E;--body:#4F473C`;
const dots = (n) => `<div class="dots">${Array.from({ length: n }, (_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>`;
const TOPBAR = `<div class="top"><span class="lab">${post.label}</span><span class="h">@yourbrand</span></div>`;
const N = post.slides ? post.slides.length : 1;
let h = "";
if (post.kind === "single") {
  F.className = "dark";
  h = `<div class="bg">${'<svg width="1080" height="1350">' + SCENE[post.scene]() + "</svg>"}</div><div class="veil"></div>
  <div class="safe">${TOPBAR}
    ${post.arabic ? `<div class="ar q">${post.arabic}</div>` : ""}
    <div class="big" style="${post.size ? `font-size:${post.size}px` : ""}">${md(post.text)}</div>
    <div class="ref">${post.src}</div>
    <div class="bot">${md(post.ask)}</div></div>`;
} else {
  F.className = "paper";
  const t = sl.t;
  if (t === "cover") h = `<div class="safe cover" style="--artmax:${sl.artmax || 640}px">${TOPBAR}
      <h1 style="${sl.size ? `font-size:${sl.size}px` : ""}">${md(sl.title)}</h1><div class="sub">${md(sl.sub)}</div>
      <div class="art">${svg(sl.art, P)}</div>
      <div class="foot">${dots(N)}<span class="cta">${sl.cta || "Swipe"} →</span></div></div>`;
  else if (t === "item" && sl.quran) h = `<div class="safe">${TOPBAR}
      <div class="num"><b>${String(sl.n).padStart(2, "0")}</b><span>/ ${String(post.count).padStart(2, "0")}</span></div>
      <h2>${md(sl.title)}</h2>
      <div class="art qcard"><div class="qin">${svg("hands-raised", P)}<div class="ar q" style="font-size:${sl.qs || 66}px">${sl.ar}</div></div></div>
      <div class="qt c">${md(sl.q)}</div>
      <div class="foot"><span class="src">${sl.src}</span>${dots(N)}<span class="swipe">→</span></div></div>`;
  else if (t === "item") h = `<div class="safe" style="--artmax:${sl.artmax || 400}px">${TOPBAR}
      <div class="num"><b>${String(sl.n).padStart(2, "0")}</b><span>/ ${String(post.count).padStart(2, "0")}</span></div>
      <h2 style="${sl.size ? `font-size:${sl.size}px` : ""}">${md(sl.title)}</h2>
      <div class="art">${svg(sl.art, P)}</div>
      ${sl.ar ? `<div class="ar${sl.quran ? " q" : ""}">${sl.ar}</div>` : ""}${sl.tr ? `<div class="tr">${sl.tr}</div>` : ""}
      <div class="qt${sl.ar ? " c" : ""}">${md(sl.q)}</div>
      <div class="foot"><span class="src">${sl.src}</span>${dots(N)}<span class="swipe">→</span></div></div>`;
  else if (t === "recap") h = `<div class="safe">${TOPBAR}
      <h2 style="margin-top:44px">${md(sl.title)}</h2>${sl.src ? `<span class="src rsrc">${sl.src}</span>` : ""}
      <div class="list">${sl.items.map((x, k) => `<div><i>${k + 1}</i><span>${md(x)}</span></div>`).join("")}</div>
      <div class="ask">${md(sl.ask)}</div>
      <div class="foot">${dots(N)}<span class="cta">${sl.cta}</span></div></div>`;
}
F.innerHTML = h;
document.fonts.ready.then(() => { window.__ready = true; });
</script></body></html>
