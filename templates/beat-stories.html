.beat{position:absolute;left:70px;right:70px;top:1350px;text-align:center;font:700 58px/1.22 "Source Serif 4",serif;color:var(--ink);text-wrap:balance}

.ref{position:absolute;left:0;right:0;top:1560px;text-align:center;font:600 26px/1 "Source Serif 4",serif;letter-spacing:.24em;color:#8A7A5E}

.sref{position:absolute;left:0;right:0;top:1500px;text-align:center;font:600 26px/1 "Source Serif 4",serif;letter-spacing:.24em;color:#8A7A5E}
.dot{display:inline-grid;place-items:center;width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);font:700 24px/1 "Source Serif 4",serif;color:var(--ink);margin:8px;box-sizing:border-box}
.btn{display:inline-block;background:var(--ink);color:var(--cream);font:700 50px/1 "Source Serif 4",serif;padding:28px 60px 26px;border-radius:999px}

 ["Sulaiman", "27:16 · 34:12", [null, "Heir of <b>Dawud</b>.", "The <b>wind</b> and the jinn served him.", "And the speech of <b>birds</b>."]], ["Ilyas", "37:123-125", [null, "He warned against worshipping <b>Baal</b>."]], ["Al-Yasa", "6:86 · 38:48", [null, "Preferred over the <b>worlds</b>."]], ["Yunus", "37:140-142 · 21:87", [null, "He left in <b>anger</b>.", "A fish <b>swallowed</b> him.", "In the darkness he called:", "There is no god <b>but You</b>."]], ["Zakariya & Yahya", "19:4-12", [null, "He prayed for a <b>son</b> in old age.", "Allah gave him <b>Yahya</b>.", "Wise as a <b>boy</b>."]], ["Isa", "3:45-49", [null, "Son of <b>Maryam</b>.", "He healed the blind and raised the <b>dead</b>, by the permission of Allah."]], ["Muhammad", "33:40", [null]], ["Ahzab", "33:40", ["The Messenger of Allah and the <b>seal</b> of the prophets."]], ["Anbiya", "21:107", ["We sent you only as a <b>mercy</b> to the worlds."]], ["Qalam", "68:4", ["You are of a <b>great character</b>."]], ["Tawbah", "9:128", ["Your suffering weighs on him.", "To the believers, <b>kind and merciful</b>."]], ["end", "", ["That is all <b>25</b>.", "Whose <b>full story</b> do you want?"]]]</script>

<script>
// faith brand reel 05p: every prophet named in the Quran as micro-stories (1-9 beats each), built after studying
// the @islaminsketches reel (2:45, light editorial look, a new beat line about every 1.5 s). Our own script, Urdu
// voice and art. No prophet is drawn: names, the ayah, and objects from each story. Each beat is its own voice
// clip, so the picture changes exactly on the spoken word.
const T = window.TIMES, CAPS = window.CAPS;
window.DURATION = T[T.length - 1];
const HANDLE = "@yourbrand";
const SC = JSON.parse(document.getElementById("sc").textContent);
const BEATS = SC.map((x) => x[2].length);
const FIRST = BEATS.map((_, i) => BEATS.slice(0, i).reduce((a, b) => a + b, 0));
const bs = (s, k) => CAPS[FIRST[s] + k][0];
const beatAt = (s, abs) => { let k = 0; while (k + 1 < BEATS[s] && abs >= bs(s, k + 1)) k++; return k; };
// The art shows its first picture already while the name is spoken (no empty frame on the name beat).
const bv = (s, abs) => (BEATS[s] > 1 ? Math.max(1, beatAt(s, abs)) : beatAt(s, abs));
const AL = (s) => s.replace(/\bAllah\b/g, `<span class="al">اللّٰه</span>`);
const W = 1080, H = 1920, TAU = Math.PI * 2;
const f1 = (x) => (+x).toFixed(1), S = Math.sin, C = Math.cos;
const INK = "#3B2F22", SAGE = "#A9BE8A", TAN = "#DCC9A3", WH = "#FBF7EE", GF = "#E2B94A", BLU = "#A9BFCC", TER = "#D98C6A", DARK = "#2A2A3A";
const SW = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const glow = (x, y, r, o = 1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#gl)" opacity="${f1(o)}"/>`;
const star = (cx, cy, r, fill = GF) => { let p = []; for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6, rr = k % 2 ? r * 0.42 : r; p.push(`${f1(cx + rr * S(a))},${f1(cy - rr * C(a))}`); } return `<polygon points="${p.join(" ")}" fill="${fill}"/>`; };
const ease = (x) => E.out(Math.max(0, Math.min(1, x)));
const IN = (abs, s, k, d = 0.5) => ease((abs - bs(s, k)) / d);
const wave = (y, amp, ph, x0 = 10, x1 = 290, col = GF, w = 3) => { let d = `M${x0} ${f1(y)}`; for (let x = x0; x <= x1; x += 6) d += ` L${x} ${f1(y + amp * S(x / 14 + ph))}`; return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; };
const ground = `<path d="M30 214 H270" ${SW} opacity=".35"/>`;
const house = (x, w, h, base = 200) => `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="${TAN}" ${SW}/><rect x="${x + w / 2 - 5}" y="${base - h + 12}" width="10" height="14" fill="${INK}" opacity=".55"/>`;
const shake = (a, s, k) => 4 * S(a * 40) * Math.max(0, 1 - (a - bs(s, k)) / 2.5);
const quake = (o) => `<path d="M30 222 L60 210 L84 224 L114 206 L150 222 L180 208 L214 224 L262 210" fill="none" stroke="${INK}" stroke-width="3" opacity="${f1(o)}"/>`;

// ---------- illustrations: D[s](abs, t, s) -> svg in a 300x250 box ----------
const D = {
  1: (a, t, s) => { const b = bv(s, a), fall = b >= 2 ? IN(a, s, 2, 1.0) : 0, rep = b >= 3 ? IN(a, s, 3, 0.8) : 0;
    return `${glow(150, 90, 90, 0.7 + 0.3 * rep)}${ground}<path d="M150 210 V128 M150 156 L128 138 M150 146 L174 128" ${SW} fill="none"/>
      <circle cx="150" cy="92" r="46" fill="${SAGE}" ${SW}/>
      ${[[134, 80], [166, 98], [146, 110], [170, 74]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="7" fill="${GF}" ${SW}/>`).join("")}
      ${b >= 2 ? `<circle cx="${f1(118 - 24 * fall)}" cy="${f1(104 + 100 * fall)}" r="7" fill="${GF}" ${SW}/>` : ""}
      ${rep ? `${star(150, 22 + 10 * (1 - rep), 13 * rep)}${star(58, 60, 7 * rep)}${star(242, 60, 7 * rep)}` : ""}`; },
  2: (a, t, s) => { const b = bv(s, a), up = b >= 2 ? IN(a, s, 2, 1.4) : 0;
    return `${b >= 2 ? `<path d="M40 214 L120 120 L150 150 L190 96 L262 214 Z" fill="${TAN}" ${SW}/>` : ""}
      ${b >= 1 ? `<g transform="translate(150 ${b >= 2 ? 196 : 140}) scale(${b >= 2 ? 0.5 : 1})">${glow(0, -10, 80)}<path d="M0 -30 C-22 -40 -48 -40 -70 -30 V30 C-48 20 -22 20 0 30 Z M0 -30 C22 -40 48 -40 70 -30 V30 C48 20 22 20 0 30 Z" fill="${WH}" ${SW}/>${[0, 1, 2].map((k) => `<path d="M-58 ${-16 + k * 14} H-12 M12 ${-16 + k * 14} H58" ${SW} opacity=".45"/>`).join("")}</g>` : ""}
      ${up ? `${glow(150, 200 - 168 * up, 34)}${star(150, 200 - 168 * up, 14)}<path d="M150 ${f1(214)} V${f1(214 - 160 * up)}" stroke="${GF}" stroke-width="3" stroke-dasharray="4 7"/>` : ""}`; },
  3: (a, t, s) => { const b = bv(s, a), fl = b >= 3 ? IN(a, s, 3, 1.2) : 0, by = 168 - 50 * fl + 3 * S(t * 2.4) * fl;
    return `${b === 1 ? `${glow(150, 120, 90)}<text x="150" y="150" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="800" font-size="92" fill="${INK}">950</text><text x="150" y="184" text-anchor="middle" font-family="'Source Serif 4', serif" font-weight="600" font-size="20" letter-spacing="6" fill="${INK}" opacity=".7">YEARS</text>` : ""}
      ${b >= 2 ? `${glow(150, by - 20, 80, 0.6)}<g transform="translate(0 ${f1(by - 168)}) rotate(${f1(fl * 3 * S(t * 2))} 150 168)"><path d="M86 160 H214 L196 188 H104 Z" fill="${WH}" ${SW}/><rect x="122" y="128" width="56" height="32" fill="${TAN}" ${SW}/><path d="M118 128 L150 108 L182 128 Z" fill="${TAN}" ${SW}/></g>` : ""}
      ${b === 2 ? ground : ""}${fl ? `${wave(214 - 40 * fl, 6, t * 3, 10, 290, BLU, 4)}${wave(228 - 40 * fl, 6, t * 3 + 2, 10, 290, BLU, 4)}${Array.from({ length: 10 }, (_, k) => `<path d="M${20 + k * 28} ${f1((t * 160 + k * 37) % 120)} l-6 16" stroke="${BLU}" stroke-width="2.5" stroke-linecap="round"/>`).join("")}` : ""}`; },
  4: (a, t, s) => { const b = bv(s, a), cl = b >= 2 ? IN(a, s, 2, 0.8) : 0, wd = b >= 3 ? IN(a, s, 3, 1.4) : 0;
    const pillars = [60, 100, 140, 180, 220].map((x, k) => `<g transform="rotate(${f1(wd * (18 + k * 6))} ${x + 10} 214)"><rect x="${x}" y="${100 + (k % 2) * 16}" width="22" height="${114 - (k % 2) * 16}" fill="${TAN}" ${SW}/><rect x="${x - 4}" y="${94 + (k % 2) * 16}" width="30" height="8" fill="${TAN}" ${SW}/></g>`).join("");
    return `${ground}${pillars}${cl ? `<path d="M70 60 C70 40 100 36 112 50 C124 30 160 32 166 52 C190 46 204 66 192 80 H78 C62 80 58 66 70 60 Z" fill="#B8B3A8" ${SW} opacity="${f1(cl)}"/>` : ""}
      ${wd ? [0, 1, 2].map((k) => `<path d="M${30 + k * 8} ${100 + k * 34} C80 ${80 + k * 34} 170 ${80 + k * 34} 230 ${100 + k * 34} C250 ${108 + k * 34} 240 ${122 + k * 34} 222 ${116 + k * 34}" fill="none" stroke="${INK}" stroke-width="3" stroke-dasharray="40 16" stroke-dashoffset="${f1(-t * 90 - k * 20)}" opacity="${f1(wd)}"/>`).join("") : ""}`; },
  5: (a, t, s) => { const b = bv(s, a), gone = b >= 2 ? IN(a, s, 2, 0.9) : 0, q = b >= 3 ? IN(a, s, 3, 0.4) : 0, sh = q ? shake(a, s, 3) : 0;
    return `<g transform="translate(${f1(sh)} 0)">${glow(150, 140, 90, 1 - gone)}<path d="M20 214 L80 150 L100 170 L120 140 L150 214 Z M200 214 L240 160 L282 214 Z" fill="${TAN}" ${SW} opacity=".6"/>${ground}
      <g opacity="${f1(1 - 0.7 * gone)}" ${gone ? `stroke-dasharray="5 6"` : ""}><path d="M110 170 L108 210 M124 172 L126 210 M170 172 L168 210 M184 170 L186 210" ${SW}/>
      <path d="M100 168 C96 150 108 142 120 144 C128 116 160 116 166 144 C176 142 184 146 188 152 L192 134 C194 122 202 114 214 118 L222 122 L218 130 L206 130 L202 158 C200 170 184 176 170 176 L116 176 C106 176 102 174 100 168 Z" fill="${gone ? "none" : WH}" ${SW}/></g>${q ? quake(q) : ""}</g>`; },
  6: (a, t, s) => { const b = bv(s, a), fire = b >= 2 ? IN(a, s, 2, 0.6) : 0, cool = b >= 3 ? IN(a, s, 3, 1.2) : 0;
    const blocks = `<g opacity="${f1(1 - 0.6 * fire)}"><rect x="40" y="150" width="40" height="60" fill="${TAN}" ${SW}/><rect x="96" y="176" width="54" height="34" fill="${TAN}" ${SW} transform="rotate(-12 123 193)"/><rect x="236" y="160" width="34" height="50" fill="${TAN}" ${SW}/><path d="M48 166 L72 186 M244 172 L262 196" ${SW}/><path d="M190 120 L214 196 M180 130 L204 116" ${SW}/></g>`;
    const c1 = cool ? `rgb(${Math.round(217 - 60 * cool)},${Math.round(140 + 60 * cool)},${Math.round(106 + 110 * cool)})` : TER;
    return `${ground}${b >= 1 ? blocks : ""}${fire ? `${glow(150, 140, 90, fire)}<g transform="translate(150 212) scale(${f1(fire * (1 + 0.04 * S(t * 12)))}) translate(-150 -212)"><path d="M150 212 C110 200 108 156 132 120 C134 140 144 146 150 142 C142 118 156 92 176 76 C172 110 196 130 192 164 C190 196 172 212 150 212 Z" fill="${c1}" ${SW}/><path d="M150 210 C134 204 132 184 144 166 C146 178 152 180 156 176 C160 190 164 202 150 210 Z" fill="${cool ? WH : GF}" ${SW}/></g>` : ""}
      ${cool ? [70, 100, 200, 230].map((x) => `<path d="M${x} 212 V${f1(212 - 26 * cool)} M${x} ${f1(212 - 14 * cool)} C${x - 10} ${f1(212 - 20 * cool)} ${x - 12} ${f1(212 - 28 * cool)} ${x - 8} ${f1(212 - 32 * cool)}" fill="none" stroke="#6E8F55" stroke-width="3" stroke-linecap="round"/>`).join("") : ""}`; },
  7: (a, t, s) => { const b = bv(s, a), fl = b >= 2 ? IN(a, s, 2, 1.0) : 0;
    return `${ground}<g transform="rotate(${f1(180 * fl)} 150 156)">${house(60, 36, 60)}${house(100, 44, 84)}${house(148, 38, 66)}${house(190, 46, 90)}<path d="M50 200 H246" ${SW}/></g>
      ${b === 1 ? `<circle cx="150" cy="150" r="${f1(74 + 6 * S(t * 3))}" fill="none" stroke="${TER}" stroke-width="3" stroke-dasharray="6 8" opacity=".7"/>` : ""}
      ${fl ? Array.from({ length: 8 }, (_, k) => `<circle cx="${30 + k * 34}" cy="${f1(((t * 150 + k * 29) % 220) - 10)}" r="5" fill="#9A8A70" ${SW}/>`).join("") : ""}`; },
  8: (a, t, s) => { const b = bv(s, a), ram = b >= 2 ? IN(a, s, 2, 0.8) : 0;
    return `<path d="M88 36 A26 26 0 1 0 114 74 A20 20 0 1 1 88 36 Z" fill="${GF}" ${SW} opacity="${f1(1 - 0.5 * ram)}"/>
      ${b >= 1 ? `<g opacity="${f1(1 - 0.7 * ram)}"><path d="M150 40 C150 22 178 16 190 30 C206 18 236 26 234 46 C252 52 248 76 228 76 H164 C146 76 140 56 150 40 Z" fill="${WH}" ${SW}/>${star(192, 52, 9)}<circle cx="146" cy="88" r="5" fill="${WH}" ${SW}/><circle cx="136" cy="100" r="3" fill="${WH}" ${SW}/></g>` : ""}
      ${ground}${ram ? `<g transform="translate(0 ${f1(20 * (1 - ram))})" opacity="${f1(ram)}">${glow(150, 160, 70)}<path d="M112 176 L112 208 M128 178 L128 208 M172 178 L172 208 M188 176 L188 208" ${SW}/>
      <path d="M100 172 C94 150 116 136 138 144 C156 132 184 136 194 152 C202 168 196 182 178 184 L118 186 C106 186 102 180 100 172 Z" fill="${WH}" ${SW}/><path d="M192 150 C198 136 214 132 220 144 C224 154 218 166 206 166 L196 162 Z" fill="${WH}" ${SW}/><path d="M200 144 C188 126 168 134 174 148 C178 158 192 156 192 148" fill="none" ${SW}/></g>` : ""}`; },
  9: (a, t, s) => { const b = bv(s, a), n = [["Ibrahim", 40, 1], ["Ishaq", 96, b >= 1 ? 1 : 0.5], ["Yaqub", 152, b >= 1 ? 1 : 0.5], ["Yusuf", 208, b >= 2 ? IN(a, s, 2) : 0]];
    return n.map(([nm, y, o], k) => o ? `<g opacity="${f1(o)}">${k ? `<path d="M110 ${y - 42} V${y - 14}" ${SW}/>` : ""}<circle cx="110" cy="${y}" r="13" fill="${(k === 3) || (k >= 1 && k <= 2 && b === 1) ? GF : WH}" ${SW}/><text x="138" y="${y + 8}" font-family="'Source Serif 4', serif" font-weight="700" font-size="24" fill="${INK}">${nm}</text></g>` : "").join(""); },
  10: (a, t, s) => { const b = bv(s, a), bow = b >= 7 ? IN(a, s, 7, 0.8) : 0, tru = b >= 8 ? IN(a, s, 8, 0.8) : 0;
    const icon = (k, html) => b >= k ? `<g transform="translate(${40 + (k - 2) * 56} 200) scale(${f1(1.3 * IN(a, s, k, 0.35))})">${html}</g>` : "";
    return `${glow(150, 70, 80, 0.6 + 0.4 * tru)}${b >= 1 ? `${Array.from({ length: 11 }, (_, k) => { const ang = Math.PI * (0.15 + 0.7 * k / 10), x = 150 - 70 * C(ang), y = 94 - 40 * S(ang) + 8 * bow; return star(x, y, 8); }).join("")}
      <path d="M44 ${f1(40 + 12 * bow)} A16 16 0 1 0 60 ${f1(68 + 12 * bow)} A12 12 0 1 1 44 ${f1(40 + 12 * bow)} Z" fill="${GF}" ${SW}/><circle cx="252" cy="${f1(54 + 12 * bow)}" r="15" fill="${GF}" ${SW}/>` : ""}
      ${icon(2, Array.from({ length: 10 }, (_, k) => `<circle cx="${-14 + (k % 5) * 7}" cy="${-8 + Math.floor(k / 5) * 9}" r="3.4" fill="${INK}" opacity=".7"/>`).join("") + `<circle cx="26" cy="-4" r="5" fill="${GF}" ${SW}/>`)}
      ${icon(3, `<ellipse cx="0" cy="0" rx="18" ry="7" fill="${INK}" opacity=".8"/><path d="M-18 0 V10 Q0 18 18 10 V0" fill="${TAN}" ${SW}/><path d="M0 -24 V-2" ${SW}/>`)}
      ${icon(4, [-10, 0, 10].map((x, k) => `<circle cx="${x}" cy="${-k * 4}" r="8" fill="${GF}" ${SW}/>`).join(""))}
      ${icon(5, `<rect x="-16" y="-18" width="32" height="32" fill="${TAN}" ${SW}/><path d="M-8 -18 V14 M0 -18 V14 M8 -18 V14" ${SW}/>`)}
      ${icon(6, `<path d="M-18 10 V-8 L-9 2 L0 -14 L9 2 L18 -8 V10 Z" fill="${GF}" ${SW}/>`)}`; },
  11: (a, t, s) => { const b = bv(s, a), call = b >= 2 ? IN(a, s, 2, 0.4) : 0, heal = b >= 3 ? IN(a, s, 3, 1.0) : 0, droop = 1 - heal;
    const leaf = (dir) => `<path d="M150 ${f1(160 - 10 * heal)} Q${f1(150 + dir * 30)} ${f1(150 + 30 * droop - 20 * heal)} ${f1(150 + dir * 44)} ${f1(170 + 34 * droop - 40 * heal)} Q${f1(150 + dir * 14)} ${f1(176 + 20 * droop - 26 * heal)} 150 ${f1(160 - 10 * heal)} Z" fill="${heal > 0.5 ? SAGE : TAN}" ${SW}/>`;
