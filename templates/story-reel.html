<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=block" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="capbig.css">
<style>
#stage{background:#0E1030}
.pic{position:absolute;inset:0;overflow:hidden}
.pic img{position:absolute;left:0;top:0;max-width:none}
.shade{position:absolute;left:0;right:0;bottom:0;height:820px;background:linear-gradient(180deg,rgba(10,6,20,0),rgba(10,6,20,.78) 70%)}
.pill{position:absolute;left:0;right:0;top:120px;text-align:center}
.pill span{display:inline-block;background:#fff;border-radius:16px;padding:14px 28px 16px;font:800 44px/1 Poppins;color:#1D1A26;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.pill .r{color:#E0283A}
</style></head>
<body><div id="stage"></div>
<script src="lib.js"></script>
<script src="vo/reel66-timing.js"></script>
<script>
// Reel 66: "Chhathi Maiya kaun hain? Part 2". Opens mid-story on the devi leaving with the baby (hook), big Hinglish
// captions at the bottom, a comment ask, end card with Sunday's arghya + child's kundli on yourbrand.com.
const T = window.TIMES, C = window.CAPS;
window.DURATION = T[T.length - 1];
const A = "../chhath-art/";
// [image, focusX from %, to %, zoom from, zoom to, focusY from %, to %] (full-bleed cover)
const SH = [
  ["c11", 40, 60, 1.18, 1.02, 20, 40],
  ["c12", 50, 50, 1.02, 1.16, 15, 25],
  ["c13", 50, 50, 1.16, 1.02, 10, 40],
  ["c14", 20, 80, 1.10, 1.04, 40, 40],
  ["c15", 20, 70, 1.12, 1.04, 30, 40],
  ["c16", 20, 70, 1.02, 1.14, 30, 60],
  ["c17", 30, 70, 1.14, 1.02, 30, 40],
  ["c18", 40, 55, 1.02, 1.14, 40, 30],
];
// Smooth zoom transition: the next shot pushes in from 1.14x with a short blur while the last one keeps zooming.
const TR = 0.35;
SH.forEach(([im, x0, x1, z0, z1, y0, y1], i) => {
  const a = T[i], b = T[i + 1] + TR;
  scene(a, b, () => `<div class="pic"><img class="im" src="${A}${im}.png"></div><div class="shade"></div>`,
    (el, t) => {
      const im = $(el, ".im"); if (!im.naturalWidth) return;
      const d = b - a, base = Math.max(1080 / im.naturalWidth, 1920 / im.naturalHeight);
      const p = pr(t, 0, d, E.lin), inn = i === 0 ? 1 : pr(t, 0, TR, E.out), out = pr(t, d - TR, d, E.in);
      const z = base * mix(z0, z1, p) * mix(1.14, 1, inn) * mix(1, 1.08, out);
      const w = im.naturalWidth * z, h = im.naturalHeight * z;
      const x = -(w - 1080) * mix(x0, x1, p) / 100, y = -(h - 1920) * mix(y0, y1, p) / 100;
      im.style.width = im.naturalWidth + "px"; im.style.height = im.naturalHeight + "px";
      im.style.transformOrigin = "0 0"; im.style.transform = `translate(${x}px,${y}px) scale(${z})`;
      el.style.opacity = inn; im.style.filter = inn < 1 ? `blur(${mix(14, 0, inn).toFixed(1)}px)` : "none";
    }, 2 + i);
});
const SE = T[SH.length];
// Hook: first 2.6 s.
scene(0, 2.7, () => `<div class="hook" style="top:1020px"><div class="h2">Chhathi Maiya kaun hain? · Part 2</div><div class="h1">Devi bachche ko <b>le ja rahi thi</b> 😳</div></div>`,
  (el, t) => { el.style.opacity = 1 - pr(t, 2.4, 2.7); $(el, ".h1").style.scale = mix(1.12, 1, pr(t, 0, 0.35, E.back)); }, 31);
// Title pill after the hook.
scene(2.6, SE, () => `<div class="pill"><span><span class="r">Chhathi Maiya</span> kaun hain? · Part 2</span></div>`,
  (el, t) => { el.style.opacity = pr(t, 0, 0.3) * (1 - pr(t, SE - 2.6 - 0.4, SE - 2.6)); }, 30);
// Caption chunks (skip the ones under the hook).
C.forEach(([a, b, txt]) => {
  const a2 = Math.max(a, 2.7); if (b <= a2 + 0.2) return;
  scene(a2, b + 0.15, () => `<div class="bcap" style="bottom:360px">${txt}</div>`,
    (el, t) => { el.style.opacity = pr(t, 0, 0.12) * (1 - pr(t, b - a2, b - a2 + 0.15)); el.style.scale = mix(0.92, 1, pr(t, 0, 0.18, E.back)); }, 21);
});
// Comment ask when the first Chhath is shown.
scene(T[5] + 0.4, T[6], () => `<div class="ask" style="top:250px"><span>Aapke ghar Chhath kaun karta hai? 👇</span></div>`,
  (el, t) => { el.style.opacity = pr(t, 0, 0.2) * (1 - pr(t, T[6] - T[5] - 0.6, T[6] - T[5] - 0.4)); popIn(el, "span", t, [0], 0.8); }, 32);
// End card.
const MK = (s, id) => MARK(s).replaceAll('"mt"', `"mt${id}"`).replaceAll("#mt)", `#mt${id})`).replaceAll('"mg"', `"mg${id}"`).replaceAll("#mg)", `#mg${id})`);
scene(SE, window.DURATION, () => `<div class="pic"><img src="${A}c18.png" style="height:1920px;left:50%;translate:-50% 0;filter:blur(26px) brightness(.4)"></div>
  <div class="nx" style="position:absolute;left:60px;right:60px;top:200px;text-align:center">
    <div style="font:800 46px/1 Poppins;color:#FFD27A">Chhathi Maiya kaun hain?</div>
    <div style="margin-top:18px;font:900 120px/1 Poppins;color:#FFF8EC">Part 3 · Kal</div>
    <div style="margin-top:22px;font:800 52px/1.25 Poppins;color:#FFE7C2">Doobte suraj ko arghya <span style="color:#FFD43B">kyun</span> dete hain? 🌅</div>
    <div style="margin-top:30px"><span style="display:inline-block;background:#FFD43B;color:#1D1A26;font:900 44px/1 Poppins;padding:22px 34px;border-radius:999px;white-space:nowrap;box-shadow:0 12px 30px rgba(0,0,0,.35)">🔔 Follow karo, kahani chhoote nahi</span></div></div>
  <div class="ec" style="position:absolute;left:100px;right:100px;top:830px;background:#FFF8EC;border-radius:30px;padding:34px 30px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4)">
    <div style="font:800 44px/1.2 Poppins;color:#7A1A1E">yourbrand.com</div><div style="margin-top:10px;font:700 32px/1.2 Poppins;color:#B0702A">/festivals/chhath-puja</div>
    <div style="margin-top:16px;font:700 32px/1.3 Poppins;color:#5A3A2A">Arghya ka sahi samay, apne shehar ke hisaab se</div>
    <div style="margin-top:16px;font:800 38px/1.3 Poppins;color:#2A0D12">Apne bachche ki <span style="color:#B0461E">kundli FREE</span> 🙏</div>
    <div style="margin-top:14px;font:800 36px/1 Poppins;color:#2A0D12">Pehli chat <span style="background:#4ADE80;color:#16131C;padding:4px 12px;border-radius:10px;font:800 26px/1 Poppins">FREE</span></div></div>
  <div class="jc" style="position:absolute;left:60px;right:60px;top:1330px;text-align:center"><div style="font:700 44px/1.2 Poppins;color:#FFE7C2">Comment mein likho</div><div style="margin-top:14px;font:900 80px/1.05 Poppins;color:#FFD43B">Jai Chhathi Maiya 🙏</div></div>
  <div style="position:absolute;left:0;right:0;top:1560px;display:flex;justify-content:center;align-items:center;gap:18px">${MK(64, "e")}<span style="font:700 38px/1 Poppins;color:#FFE7C2">@yourbrand</span></div>`,
  (el, t) => { el.style.opacity = pr(t, 0, 0.4); popIn(el, ".nx, .ec, .jc", t, [0.05, 0.45, 0.75], 0.85); }, 40);
</script></body></html>
